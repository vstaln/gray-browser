[package]
name = "gray-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless-chromium browser tools for the gray agent harness"
license = "MIT"
[lib]
name = "browser_plugin"
path = "src/lib.rs"
[[bin]]
name = "browser"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["tls"] }
